[package]
name = "form3d"
version = "0.2.0"
description = "Form 3D Studio - 5-Step Modular Text-to-3D Generator"
authors = ["Duc Nguyen <minhduc.nguyennam@gmail.com>"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
